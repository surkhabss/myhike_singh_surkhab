<!doctype html>
<html lang="en">
  <head>
    <title>Hike details | Surkhab Hikes</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
  </head>

  <body>

    <site-navbar></site-navbar>

    <main class="container py-4">
      <a href="main.html" class="btn btn-secondary mb-3">Back to hikes</a>
      <h1 id="hikeName">Loading...</h1>
      <img
        id="hikeImage"
        class="img-fluid rounded mt-3"
        hidden
        alt="Hike image"
      />
      <p class="mt-2">
        <span class="badge rounded-pill bg-accent border fw-normal"
          ><i class="bi bi-eye-fill me-1" aria-hidden="true"></i
          ><span id="viewCount">0</span> views</span
        >
      </p>
      <p id="hikeDetails" class="mt-3"></p>
      <section class="my-4" aria-labelledby="writeReviewHeading">
        <h2 id="writeReviewHeading">Write a review</h2>
        <form id="reviewForm" class="border rounded p-3">
          <label for="reviewTitle" class="form-label">Title</label>
          <input
            id="reviewTitle"
            class="form-control mb-3"
            required
            maxlength="120"
          />
          <label for="reviewRating" class="form-label">Rating</label>
          <select id="reviewRating" class="form-select mb-3" required>
            <option value="">Choose a rating</option>
            <option value="1">1 star</option>
            <option value="2">2 stars</option>
            <option value="3">3 stars</option>
            <option value="4">4 stars</option>
            <option value="5">5 stars</option>
          </select>
          <label for="reviewText" class="form-label">Your review</label>
          <textarea
            id="reviewText"
            class="form-control mb-3"
            rows="3"
            required
            maxlength="2000"
          ></textarea>
          <button
            id="reviewSubmit"
            type="submit"
            class="btn btn-primary"
            disabled
          >
            Submit review
          </button>
          <p id="review-status" class="mt-2 mb-0" role="status"></p>
        </form>
      </section>
      <section aria-labelledby="latestReviewsHeading">
        <h2 id="latestReviewsHeading">Latest reviews</h2>
        <p id="reviews-status" role="status">Loading reviews…</p>
        <div id="reviews-go-here"></div>
      </section>
    </main>
    <template id="reviewTemplate">
      <article class="border rounded p-3 mb-3">
        <h3 class="review-title h5"></h3>
        <p class="review-meta text-secondary small"></p>
        <p class="review-text mb-0"></p>
      </article>
    </template>

    <site-footer></site-footer>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/eachHike.js"></script>
  </body>
</html>
